<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Product Lifecycle Framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  /* Tokens follow the Reel Classic system (paper, ink, red accent, halftone dots). */
  :root{
    --f-display:"Space Grotesk", system-ui, sans-serif;
    --f-serif:"Instrument Serif", Georgia, serif;
    --f-mono:"JetBrains Mono", ui-monospace, monospace;
    color-scheme:light;
    --bg:#F6F5F1; --bg-dot:rgba(17,17,17,.16); --surface:#FFFFFF; --surface-2:#F8F7F3; --surface-3:#EDEAE3;
    --border:#CFCBC2; --border-soft:#DDDAD2; --ink:#111111;
    --text:#111111; --text-dim:#45423D; --text-faint:#6E6B64;
    --accent:#E8341A; --accent-soft:#C9290F; --accent-dim:#F2B4A7; --accent-wash:#FCE9E4; --accent-ink:#FFFFFF;
    --green:#1F7A47; --green-wash:#E4F1E8; --blue:#2F5E8A; --blue-wash:#E5EDF5;
    --gold:#9A6200; --gold-wash:#F6EEDC; --red:#B3261E; --red-wash:#F8E4E1;
    --device:#15161A; --device-ink:#F2EFE7;
    --shadow:none; --on-chip:#111111; --flow-line:#BDB8AE; --flow-head:#E8341A;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#151519; --bg-dot:rgba(242,239,231,.12); --surface:#202127; --surface-2:#25262C; --surface-3:#2A2B31;
    --border:#55575F; --border-soft:#3F414A; --ink:#F2EFE7;
    --text:#F2EFE7; --text-dim:#C8C5BD; --text-faint:#A3A099;
    --accent:#FF5A3D; --accent-soft:#FF7A62; --accent-dim:#6E2A1E; --accent-wash:#2E1C19; --accent-ink:#151519;
    --green:#4CC481; --green-wash:#1A2A21; --blue:#7FA8D8; --blue-wash:#1B2430;
    --gold:#E3A33B; --gold-wash:#2C2416; --red:#FF6B5B; --red-wash:#2E1C1A;
    --device:#0B0B0D; --device-ink:#F2EFE7;
    --shadow:none; --on-chip:#111111; --flow-line:#55575F; --flow-head:#FF5A3D; } }
  :root[data-theme="dark"]{ color-scheme:dark;
    --bg:#151519; --bg-dot:rgba(242,239,231,.12); --surface:#202127; --surface-2:#25262C; --surface-3:#2A2B31;
    --border:#55575F; --border-soft:#3F414A; --ink:#F2EFE7;
    --text:#F2EFE7; --text-dim:#C8C5BD; --text-faint:#A3A099;
    --accent:#FF5A3D; --accent-soft:#FF7A62; --accent-dim:#6E2A1E; --accent-wash:#2E1C19; --accent-ink:#151519;
    --green:#4CC481; --green-wash:#1A2A21; --blue:#7FA8D8; --blue-wash:#1B2430;
    --gold:#E3A33B; --gold-wash:#2C2416; --red:#FF6B5B; --red-wash:#2E1C1A;
    --device:#0B0B0D; --device-ink:#F2EFE7;
    --shadow:none; --on-chip:#111111; --flow-line:#55575F; --flow-head:#FF5A3D; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--f-display);
    overflow:hidden;
    height:100vh;
    width:100vw;
  }
  ::selection{background:var(--accent-dim);color:var(--text);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--border);}

  a{color:inherit;}
  button{font-family:inherit;}

  .mono{font-family:var(--f-mono);}
  .display{font-family:var(--f-display);}

  /* ===== App shell ===== */
  #app{position:relative;height:100vh;width:100vw;display:flex;flex-direction:column;}

  /* ===== Top bar ===== */
  #topbar{
    display:flex;align-items:center;gap:0;
    height:62px;flex:0 0 auto;
    background:var(--surface);
    border-bottom:1px solid var(--border-soft);
    padding:0 18px;
    z-index:50;
    position:relative;
  }
  /* ===== Intro header ===== */
  #identity{
    display:flex;align-items:center;gap:32px;flex:0 0 auto;
    padding:16px 24px 14px;background:var(--bg);
    border-bottom:1px solid var(--border-soft);z-index:51;position:relative;
  }
  #identity .intro{flex:1 1 auto;min-width:0;}
  .eyebrow{
    font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent-soft);margin-bottom:5px;
  }
  .eyebrow-by{display:none;color:var(--text-faint);letter-spacing:.04em;text-transform:none;font-weight:500;}
  #identity h1{
    font-family:var(--f-display);font-size:23px;font-weight:600;letter-spacing:-.015em;line-height:1.2;
    margin:0 0 5px;color:var(--text);
  }
  .lede{margin:0;font-size:12.5px;line-height:1.5;color:var(--text-dim);max-width:780px;}
  .lede b{color:var(--text);font-weight:600;}
  .signature{flex:0 0 auto;text-align:right;padding-left:24px;border-left:1px solid var(--border-soft);}
  .sig-label{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);font-weight:600;}
  .sig-name{font-family:'Allura',cursive;font-size:34px;line-height:1;color:var(--text);margin:2px 0 3px;white-space:nowrap;}
  .sig-role{font-size:11.5px;font-weight:600;color:var(--accent-soft);}
  .sig-proof{font-size:10.5px;color:var(--text-faint);margin-top:2px;white-space:nowrap;}

  #tabs{display:flex;align-items:stretch;height:100%;gap:2px;flex:1 1 auto;overflow-x:auto;scrollbar-width:none;}
  #tabs::-webkit-scrollbar{display:none;}
  .tab{
    display:flex;align-items:center;gap:8px;
    padding:0 16px;height:100%;
    border:none;background:transparent;color:var(--text-faint);
    font-size:13px;font-weight:600;letter-spacing:.01em;
    cursor:pointer;white-space:nowrap;position:relative;
    transition:color .15s ease;
  }
  .tab .n{
    font-family:var(--f-mono);font-size:10.5px;font-weight:500;
    color:var(--text-faint);opacity:.6;
  }
  .tab .tl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;}
  .tab .tt{display:flex;align-items:center;gap:7px;}
  .tab .ts{font-size:10.5px;font-weight:500;color:var(--text-faint);}
  .tab.active .n{color:var(--accent-soft);opacity:1;}
  .tab .focus{
    font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    background:var(--accent-wash);color:var(--accent-soft);border:1px solid var(--accent-dim);
    padding:2px 6px;border-radius:4px;
  }
  .tab-arrow{display:flex;align-items:center;color:var(--text-faint);opacity:.5;font-size:13px;padding:0 2px;}
  .theme-toggle{
    display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--border-soft);
    border-radius:8px;padding:3px;
  }
  .theme-toggle button{
    height:26px;padding:0 9px;border:none;background:transparent;color:var(--text-dim);border-radius:5px;
    cursor:pointer;display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  }
  .theme-toggle button svg{width:13px;height:13px;}
  .theme-toggle button:hover{color:var(--text);}
  .theme-toggle button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);}
  #topbar-right .hint{font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .tab:hover{color:var(--text-dim);}
  .tab.active{color:var(--text);}
  .tab.active::after{
    content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;
    background:var(--accent);border-radius:2px 2px 0 0;
  }
  .tab.disabled{cursor:default;color:var(--text-faint);opacity:.4;}
  .tab.disabled:hover{color:var(--text-faint);}
  .tab .soon{
    font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    background:var(--surface-3);color:var(--text-faint);
    padding:2px 6px;border-radius:4px;
  }

  #topbar-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding-left:14px;}
  .zoom-controls{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;padding:3px;}
  .zoom-controls button{
    width:26px;height:26px;border:none;background:transparent;color:var(--text-dim);
    border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:14px;transition:background .12s ease, color .12s ease;
  }
  .zoom-controls button:hover{background:var(--surface-3);color:var(--text);}
  .zoom-pct{font-family:var(--f-mono);font-size:11px;color:var(--text-faint);min-width:38px;text-align:center;}

  /* ===== Region nav pills ===== */
  #regionnav{
    display:flex;align-items:center;gap:6px;
    padding:10px 18px;flex:0 0 auto;
    background:var(--surface);
    border-bottom:1px solid var(--border-soft);
    overflow-x:auto;scrollbar-width:none;
    z-index:40;
  }
  #regionnav::-webkit-scrollbar{display:none;}
  #regionnav .lbl{
    font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-faint);flex:0 0 auto;margin-right:4px;
  }
  .pill{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    padding:6px 11px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--border-soft);
    color:var(--text-dim);font-size:12px;font-weight:500;
    cursor:pointer;white-space:nowrap;
    transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .pill:hover{border-color:var(--border);color:var(--text);}
  .pill .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}

  /* ===== Canvas viewport ===== */
  #viewport{
    position:relative;flex:1 1 auto;overflow:hidden;cursor:grab;
    background:
      radial-gradient(var(--bg-dot) .7px, transparent .8px);
    background-size:5px 5px;
    background-color:var(--bg);
  }
  #viewport.grabbing{cursor:grabbing;}
  #canvas{
    position:absolute;top:0;left:0;
    transform-origin:0 0;
    width:max-content;
    display:flex;flex-direction:column;gap:64px;
    padding:40px 60px 120px;
  }

  /* ===== Region wrapper ===== */
  .region{position:relative;}
  .region-row{display:flex;flex-direction:column;gap:64px;}
  .region-heading{
    display:flex;align-items:baseline;gap:10px;
    margin-bottom:16px;
  }
  .region-heading .rn{
    font-family:var(--f-mono);font-size:12px;color:var(--accent-soft);font-weight:600;
  }
  .region-heading h2{
    font-family:var(--f-display);font-size:26px;font-weight:600;margin:0;color:var(--text);
    letter-spacing:-.01em;
  }
  .region-heading .sub{font-size:12px;color:var(--text-faint);font-weight:500;}

  /* ===== Pipeline stage columns ===== */
  #pipeline-row, #mvp-pipeline-row, #growth-pipeline-row, #pm-pipeline-row, .pipeline-row{
    display:flex;align-items:flex-start;gap:56px;
    position:relative;
  }
  .stage-col{
    width:520px;flex:0 0 520px;
    display:flex;flex-direction:column;gap:14px;
  }
  .stage-head{
    border-radius:12px;
    padding:14px 16px;
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    position:relative;
    overflow:hidden;
  }
  .stage-head::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--stage-color, var(--accent));
  }
  .stage-head .code{
    font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;
    color:var(--stage-color, var(--accent));text-transform:uppercase;
  }
  .stage-head h3{
    font-family:var(--f-display);font-size:21px;font-weight:600;margin:4px 0 6px;color:var(--text);
  }
  .stage-head .q{
    font-size:12.5px;color:var(--text-dim);font-style:italic;line-height:1.5;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .card .ct{
    font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--text-faint);margin-bottom:8px;
    display:flex;align-items:center;gap:6px;
  }
  .card .ct .sq{width:6px;height:6px;background:var(--stage-color,var(--accent));border-radius:1.5px;flex:0 0 auto;}
  .card h4{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--text);}
  .card p{font-size:12.5px;line-height:1.55;color:var(--text-dim);margin:0 0 8px;}
  .card p:last-child{margin-bottom:0;}
  .card ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px;}
  .card ul li{font-size:12.5px;line-height:1.45;color:var(--text-dim);}
  .card ul li b, .card li b{color:var(--text);font-weight:600;}
  .card .quote{
    font-family:var(--f-display);font-style:italic;font-size:14.5px;color:var(--accent-soft);
    line-height:1.45;margin:0 0 4px;
  }
  .card .gate{
    margin-top:2px;padding-top:10px;border-top:1px dashed var(--border-soft);
    display:flex;gap:8px;align-items:flex-start;
  }
  .card .gate .g-icon{
    flex:0 0 auto;width:18px;height:18px;border-radius:5px;background:var(--green-wash);
    color:var(--green);display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px;
  }
  .badges{display:flex;flex-wrap:wrap;gap:6px;}
  .badge{
    font-family:var(--f-mono);font-size:10.5px;font-weight:500;
    padding:3px 8px;border-radius:6px;
    background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border-soft);
  }
  .out-list{display:flex;flex-direction:column;gap:6px;}
  .out-item{
    display:flex;align-items:center;gap:8px;
    font-size:12.5px;color:var(--text-dim);
  }
  .out-item::before{
    content:"";width:5px;height:5px;border-radius:1px;background:var(--stage-color,var(--accent));flex:0 0 auto;
  }

  .mini-h{
    font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--text-faint);margin:10px 0 6px;
  }
  .mini-h:first-child{margin-top:0;}

  /* connectors between stage columns */
  svg.flow-connector{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:1;}
  .stage-col{position:relative;z-index:2;}

  /* ===== Sticky-note variant for assumption categories / evidence etc ===== */
  .note-grid{display:grid;gap:10px;}
  .note{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;
    padding:12px 14px;box-shadow:var(--shadow);
  }
  .note .nt{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;}
  .note .nd{font-size:12px;color:var(--text-dim);line-height:1.5;}

  /* ===== Table-like board panel ===== */
  .panel{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .panel-head{
    padding:14px 18px;border-bottom:1px solid var(--border-soft);background:var(--surface-2);
    display:flex;align-items:center;justify-content:space-between;
  }
  .panel-head h3{font-family:var(--f-display);font-size:18px;font-weight:600;margin:0;color:var(--text);}
  .panel-head .tag{font-family:var(--f-mono);font-size:10px;color:var(--text-faint);}
  .panel-body{padding:16px 18px;}

  table.matrix{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.matrix th{
    text-align:left;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-faint);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--border-soft);
  }
  table.matrix td{padding:9px 10px;border-bottom:1px solid var(--border-soft);color:var(--text-dim);vertical-align:top;}
  table.matrix tr:last-child td{border-bottom:none;}
  table.matrix td b{color:var(--text);font-weight:600;}
  table.matrix td.mono{font-family:var(--f-mono);font-size:11.5px;}

  .kv-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row .k{color:var(--text-dim);}
  .kv-row .v{color:var(--text);font-weight:600;text-align:right;font-family:var(--f-mono);font-size:12px;}

  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-size:11.5px;padding:4px 9px;border-radius:7px;background:var(--surface-2);
    border:1px solid var(--border-soft);color:var(--text-dim);
  }

  /* level ladder for validation levels */
  .ladder{display:flex;flex-direction:column;gap:8px;}
  .rung{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
    background:var(--surface-2);border:1px solid var(--border-soft);
  }
  .rung .lv{
    font-family:var(--f-mono);font-weight:700;font-size:12px;
    width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .rung .lt{font-size:12.5px;font-weight:600;color:var(--text);}
  .rung .ld{font-size:11.5px;color:var(--text-faint);}

  /* package cards */
  .pkg-row{display:flex;gap:16px;}
  .pkg{
    flex:1;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;
    padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  }
  .pkg.flagship{border-color:var(--accent-dim);box-shadow:0 0 0 1px var(--accent-dim), var(--shadow);}
  .pkg-top{display:flex;align-items:center;justify-content:space-between;}
  .pkg-top h4{font-family:var(--f-display);font-size:18px;margin:0;color:var(--text);}
  .pkg-dur{font-family:var(--f-mono);font-size:11px;color:var(--accent-soft);background:var(--accent-wash);padding:3px 8px;border-radius:6px;}
  .pkg .flag-tag{
    align-self:flex-start;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--accent-soft);background:var(--accent-wash);padding:2px 7px;border-radius:5px;
  }

  /* week-plan timeline */
  .day-strip{display:flex;flex-direction:column;gap:6px;}
  .day{
    display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--surface-2);
    border:1px solid var(--border-soft);
  }
  .day .dn{
    font-family:var(--f-mono);font-size:10.5px;font-weight:700;color:var(--on-chip);
    background:var(--stage-color,var(--accent));border-radius:5px;padding:2px 7px;flex:0 0 auto;white-space:nowrap;
  }
  .day .dt{font-size:12px;color:var(--text-dim);line-height:1.5;}
  .day .dt b{color:var(--text);}

  /* ===== Roadmap / delegation track ===== */
  .road-track{
    display:flex; align-items:stretch; gap:0;
    overflow-x:auto; padding-bottom:4px;
  }
  .road-stop{
    display:flex; flex-direction:column; align-items:center;
    flex:1 1 0; min-width:230px; position:relative;
    padding:0 10px;
  }
  .road-stop:not(:last-child)::after{
    content:"";position:absolute; top:5px; left:calc(50% + 16px); right:calc(-50% + 16px);
    height:2px; background:var(--border-soft);
    z-index:0;
  }
  .road-dot{
    width:12px;height:12px;border-radius:50%;
    background:var(--stage-color,var(--accent));
    box-shadow:0 0 0 4px var(--surface), 0 0 0 5px var(--border-soft);
    margin-bottom:14px; flex:0 0 auto; position:relative; z-index:1;
  }
  .road-card{
    background:var(--surface-2); border:1px solid var(--border-soft); border-radius:10px;
    padding:12px 13px; width:100%; display:flex; flex-direction:column; gap:6px;
    border-top:2px solid var(--stage-color,var(--accent));
    min-height:100%;
  }

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/* Flow connector arrows across a row of .stage-col elements — drawn from
   measured positions after layout, so they always land correctly
   regardless of how tall any column renders. Shared across boards. */
function drawFlowArrows(pipelineRow){
  const old = pipelineRow.querySelector('svg.flow-connector');
  if(old) old.remove();
  const cols = Array.from(pipelineRow.querySelectorAll(':scope > .stage-col'));
  if(cols.length < 2) return;
  const rowW = pipelineRow.offsetWidth;
  const rowH = pipelineRow.offsetHeight;
  const arrowY = cols[0].querySelector('.stage-head').offsetHeight / 2 + 2;
  let svg = `<svg class="flow-connector" width="${rowW}" height="${rowH}">`;
  for(let i=0;i<cols.length-1;i++){
    const x1 = cols[i].offsetLeft + cols[i].offsetWidth;
    const x2 = cols[i+1].offsetLeft;
    svg += `<line x1="${x1+8}" y1="${arrowY}" x2="${x2-8}" y2="${arrowY}" stroke="var(--flow-line)" stroke-width="2" stroke-dasharray="1,6" stroke-linecap="round"/>`;
    svg += `<path d="M ${x2-16} ${arrowY-6} L ${x2-8} ${arrowY} L ${x2-16} ${arrowY+6}" fill="none" stroke="var(--flow-head)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  svg += `</svg>`;
  pipelineRow.insertAdjacentHTML('beforeend', svg);
}

/* Stage column builder — shared by every board's pipeline row. */
function stageColumn({id,color,code,title,question,cardsHtml}){
  const wrap = el(`<div class="stage-col" id="${id}" style="--stage-color:${color};"></div>`);
  wrap.appendChild(el(`
    <div class="stage-head">
      <div class="code">${code}</div>
      <h3>${title}</h3>
      <p class="q">${question}</p>
    </div>
  `));
  cardsHtml.forEach(h => wrap.appendChild(el(h)));
  return wrap;
}

  {region:'diagnose', label:'02 Diagnose', color:'#c9a24b'},
  {region:'hypothesise', label:'03 Hypothesise', color:'#7fa88a'},
  {region:'experiment', label:'04 Experiment', color:'#7f9db8'},
  {region:'optimise', label:'05 Optimise', color:'#b58ad9'},
  {region:'scale', label:'06 Scale', color:'#c06a5e'},
  {region:'metrics', label:'Metrics Library', color:'var(--text-faint)'},
  {region:'targets', label:'Targets &amp; Traffic-Light', color:'var(--text-faint)'},
  {region:'gates', label:'Quality Gates', color:'var(--text-faint)'},
  {region:'packages', label:'Depth Levels', color:'var(--text-faint)'},
  {region:'delivery', label:'Operating Cadence', color:'var(--text-faint)'},
  {region:'ops', label:'Scope &amp; Team', color:'var(--text-faint)'},

/* =========================================================
   PAN / ZOOM ENGINE — board-aware. Each tab rebuilds #canvas
   and #regionnav, then this engine measures the fresh layout.
   ========================================================= */
const viewport = document.getElementById('viewport');
let canvas = document.getElementById('canvas');
const regionnav = document.getElementById('regionnav');
const mmCanvas = document.getElementById('mm-canvas');
const mmViewport = document.getElementById('mm-viewport');

let scale = 0.55, minScale = 0.12, maxScale = 1.4;
let panX = 60, panY = 20;
let isPanning = false, startX=0, startY=0, startPanX=0, startPanY=0;
let WORLD_W = 4000, WORLD_H = 2000;
let regionTargets = {};

function applyTransform(){
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  document.getElementById('zoom-pct').textContent = Math.round(scale*100) + '%';
  updateMinimap();
}

viewport.addEventListener('mousedown', (e)=>{
  isPanning = true;
  viewport.classList.add('grabbing');
  startX = e.clientX; startY = e.clientY;
  startPanX = panX; startPanY = panY;
});
window.addEventListener('mousemove', (e)=>{
  if(!isPanning) return;
  panX = startPanX + (e.clientX - startX);
  panY = startPanY + (e.clientY - startY);
  applyTransform();
});
window.addEventListener('mouseup', ()=>{ isPanning=false; viewport.classList.remove('grabbing'); });

viewport.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const worldX = (mx - panX) / scale;
  const worldY = (my - panY) / scale;
  const delta = -e.deltaY * 0.0011;
  let newScale = scale * (1 + delta);
  newScale = Math.min(maxScale, Math.max(minScale, newScale));
  panX = mx - worldX * newScale;
  panY = my - worldY * newScale;
  scale = newScale;
  applyTransform();
}, {passive:false});

document.getElementById('zoom-in').addEventListener('click', ()=>{
  scale = Math.min(maxScale, scale*1.18); applyTransform();
});
document.getElementById('zoom-out').addEventListener('click', ()=>{
  scale = Math.max(minScale, scale/1.18); applyTransform();
});
document.getElementById('zoom-fit').addEventListener('click', fitAll);

/* Minimap collapse/expand */
const minimapEl = document.getElementById('minimap');
const minimapToggle = document.getElementById('minimap-toggle');
minimapToggle.addEventListener('click', ()=>{
  const collapsed = minimapEl.classList.toggle('collapsed');
  minimapToggle.textContent = collapsed ? '▢' : '–';
  minimapToggle.title = collapsed ? 'Expand map' : 'Collapse map';
});

/* Open each board at a readable zoom on its top-left orientation panel,
   rather than fitting the whole (very large) canvas into the screen. */
function openReadable(){
  const rect = viewport.getBoundingClientRect();
  scale = rect.width < 700 ? 0.5 : 0.72;
  panX = rect.width < 700 ? 8 : 20; panY = 10;
  applyTransform();
}

function fitAll(){
  const rect = viewport.getBoundingClientRect();
  const s = Math.min(rect.width/WORLD_W, rect.height/WORLD_H) * 0.96;
  scale = Math.max(minScale, Math.min(maxScale, s));
  panX = 20; panY = 10;
  applyTransform();
}

/* ---- Measure real, rendered positions of every region + stage column ----
   The browser's own flex layout is the source of truth here: nothing is
   guessed, so nothing can overlap. offsetLeft/offsetTop are measured
   relative to #canvas by walking the offsetParent chain. */
function measureRelativeToCanvas(node){
  let x = 0, y = 0, n = node;
  while(n && n !== canvas){
    x += n.offsetLeft;
    y += n.offsetTop;
    n = n.offsetParent;
  }
  return {x, y, w: node.offsetWidth, h: node.offsetHeight};
}

function measureAll(){
  WORLD_W = canvas.scrollWidth;
  WORLD_H = canvas.scrollHeight;
  regionTargets = {};
  canvas.querySelectorAll('.region[id^="region-"]').forEach(r=>{
    const key = r.id.replace('region-','');
    regionTargets[key] = measureRelativeToCanvas(r);
  });
  canvas.querySelectorAll('.stage-col[id]').forEach(c=>{
    regionTargets[c.id] = measureRelativeToCanvas(c);
  });
}

function jumpToRegion(key){
  const t = regionTargets[key];
  if(!t) return;
  const rect = viewport.getBoundingClientRect();
  const targetScale = Math.min(maxScale, Math.max(minScale, Math.min(rect.width/(t.w+140), rect.height/(t.h+140))));
  scale = targetScale;
  panX = -t.x*scale + 44;
  panY = -t.y*scale + 24;
  applyTransform();
}
/* Delegated so pills injected per-board keep working without re-binding */
regionnav.addEventListener('click', (e)=>{
  const p = e.target.closest('.pill');
  if(!p) return;
  jumpToRegion(p.getAttribute('data-region'));
});

/* Minimap */
function buildMinimapRegions(){
  mmCanvas.querySelectorAll('.mm-region').forEach(n=>n.remove());
  canvas.querySelectorAll('.region[id^="region-"]').forEach(r=>{
    const t = measureRelativeToCanvas(r);
    const box = document.createElement('div');
    box.className='mm-region';
    box.style.left = (t.x/WORLD_W*100)+'%';
    box.style.top = (t.y/WORLD_H*100)+'%';
    box.style.width = Math.max(1.2,(t.w/WORLD_W*100))+'%';
    box.style.height = Math.max(3,(t.h/WORLD_H*100))+'%';
    mmCanvas.appendChild(box);
  });
  mmCanvas.appendChild(mmViewport);
}

function updateMinimap(){
  const rect = viewport.getBoundingClientRect();
  const wx = -panX/scale, wy = -panY/scale;
  const ww = rect.width/scale, wh = rect.height/scale;
  mmViewport.style.left = Math.max(0,(wx/WORLD_W*100))+'%';
  mmViewport.style.top = Math.max(0,(wy/WORLD_H*100))+'%';
  mmViewport.style.width = Math.min(100,(ww/WORLD_W*100))+'%';
  mmViewport.style.height = Math.min(100,(wh/WORLD_H*100))+'%';
}

/* ---- Board registry & switching ---- */
const BOARDS = {
  ideation:  { build: buildIdeationBoard, pills: IDEATION_PILLS },
  mvp:       { build: buildMvpBoard,      pills: MVP_PILLS },
  growth:    { build: buildGrowthBoard,   pills: GROWTH_PILLS },
};

function renderPills(pills){
  regionnav.querySelectorAll('.pill').forEach(p=>p.remove());
  pills.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'pill';
    div.setAttribute('data-region', p.region);
    if(p.accentBorder) div.style.borderColor = 'var(--accent-dim)';
    div.innerHTML = `<span class="dot" style="background:${p.color}"></span>${p.label}`;
    regionnav.appendChild(div);
  });
}

function loadBoard(name){
  const board = BOARDS[name];
  if(!board) return;
  canvas.innerHTML = '';
  board.build(canvas);
  renderPills(board.pills);
  requestAnimationFrame(()=>{
    measureAll();
    buildMinimapRegions();
    fitAll();
  });
}

/* Tabs */
document.querySelectorAll('.pb').forEach(t=>{
  t.addEventListener('click', ()=>{
    if(t.classList.contains('disabled')) return;
    document.querySelectorAll('.pb').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    loadBoard(t.getAttribute('data-tab'));
  });
});

document.getElementById('viewtools').addEventListener('mousedown', e=>e.stopPropagation());

/* Theme switch — follows the system until the viewer picks; remembered when storage allows */
(function(){
  const root = document.documentElement, btn = document.getElementById('themebtn');
  const sysDark = () => !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  let saved = null;
  try { saved = localStorage.getItem('framework-theme'); } catch(e){}
  function apply(t, persist){
    root.setAttribute('data-theme', t);
    root.classList.toggle('is-dark', t === 'dark');
    btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    if(persist){ try { localStorage.setItem('framework-theme', t); } catch(e){} }
  }
  apply(saved === 'light' || saved === 'dark' ? saved : (sysDark() ? 'dark' : 'light'), false);
  btn.addEventListener('click', ()=>apply(root.classList.contains('is-dark') ? 'light' : 'dark', true));
})();

/* Init — measure after layout & fonts settle */
window.addEventListener('resize', ()=>{ measureAll(); applyTransform(); });

function init(){
  loadBoard('ideation');
  const act = document.querySelector('.pb.active');
  if(act){ const tabs = document.getElementById('tabs'); tabs.scrollLeft = act.offsetLeft - 10; }
}
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=> requestAnimationFrame(init));
} else {
  requestAnimationFrame(init);
}
</script>
